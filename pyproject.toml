[project]
name = "commit-cli"
version = "0.1.0"
description = "CLI que propone mensajes de commit usando llm-client."
requires-python = ">=3.12"
dependencies = [
    "llm-dev-client",
    "PyYAML>=6.0,<7",
]

[tool.uv.sources]
llm-dev-client = { path = "../llm-dev-core/packages/llm-client", editable = true }

[project.scripts]
commit-cli = "commit_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commit_cli"]